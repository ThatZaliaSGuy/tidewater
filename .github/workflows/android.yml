name: Android app

# Builds the game into an installable debug APK (the web build wrapped by Capacitor, see android/).
on:
  push:
    branches: [ android-app ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
        working-directory: android
      - uses: actions/upload-artifact@v4
        with:
          name: tidewater-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          compression-level: 0
